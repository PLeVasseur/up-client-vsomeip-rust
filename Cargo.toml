[workspace]
resolver = "2"
members = [
    "up-transport-vsomeip",
    "vsomeip-proc-macro",
    "vsomeip-sys",
]

[workspace.package]
documentation = "https://github.com/eclipse-uprotocol/up-spec#readme"
edition = "2021"
exclude = [
    "tests/*",
    "tools/*",
    ".devcontainer/*",
    ".vscode/*",
    ".github/*",
    ".gitignore",
]
keywords = ["uProtocol", "SDK", "vsomeip", "SOMEIP"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-vsomeip-rust"
rust-version = "1.88"
version = "0.5.0"

[workspace.dependencies]
async-trait = { version = "0.1" }
bimap = { version = "0.6.3" }
bytes = { version = "1.5" }
crossbeam-channel = { version = "0.5.13" }
cxx = { version = "1.0" }
lazy_static = { version = "1.4.0" }
log = { version = "0.4.21", features = [] }
once_cell = { version = "1.19.0" }
regex = { version = "1.10" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio = { version = "1.35.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "tracing"] }
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "f697559e0991fee4de2a2510f13b83607a03fc2c", default-features = false }
vsomeip-proc-macro = { version = "0.5.0", path = "vsomeip-proc-macro" }
vsomeip-sys = { version = "0.5.0", path = "vsomeip-sys", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_unsafe = "deny"
deprecated_safe_2024 = "deny"
ffi_unwind_calls = "deny"
static_mut_refs = "deny"
clashing_extern_declarations = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
borrow_as_ptr = "deny"
ptr_as_ptr = "deny"
as_ptr_cast_mut = "deny"
as_pointer_underscore = "deny"
not_unsafe_ptr_arg_deref = "deny"
transmute_ptr_to_ptr = "deny"
transmute_ptr_to_ref = "deny"
