[package]
name = "up-transport-vsomeip"
description = "Layer-1 uTransport implementation for vsomeip (SOME/IP)"
documentation.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../README.md"

[features]
default = ["bundled"]
bundled = ["vsomeip-sys/bundled"]

[dependencies]
async-trait = { version = "0.1" }
bimap = { version = "0.6.3" }
bytes = { workspace = true }
crossbeam-channel = { version = "0.5.13" }
cxx = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
up-rust = { version = "=0.10.0-SNAPSHOT", git = "https://github.com/PLeVasseur/up-rust.git", rev = "c1d13ca31859b9cc0086ef5d4b953907f24094ec", default-features = false, features = ["communication"] }
vsomeip-proc-macro = { workspace = true }
vsomeip-sys = { workspace = true }

[dev-dependencies]
env_logger = { version = "0.11.3" }
hello-world-protos = { path = "../example-utils/hello-world-protos" }
protobuf = { workspace = true }
test-case = { version = "3.3" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
