[package]
name = "up-transport-vsomeip"
description = "Native owned-frame uProtocol transport implementation for vSomeIP (SOME/IP)"
documentation = "https://docs.rs/up-transport-vsomeip"
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../README.md"

[features]
default = ["bundled"]
bundled = ["vsomeip-sys/bundled"]

[dependencies]
async-trait = { workspace = true }
bimap = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
cxx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
up-rust = { workspace = true }
vsomeip-proc-macro = { workspace = true }
vsomeip-sys = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
futures = "0.3.30"
tempfile = "3.16.0"

[dev-dependencies]
env_logger = { version = "0.11.3" }
protobuf = { version = "3.7.2" }
test-case = { version = "3.3" }
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "425c4c578896533c1717e79e11463d8cb683ef8f", default-features = false, features = ["protobuf-wire"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
